name: Release GUI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync app icons
        run: npm run sync:icons

      - name: Build app bundle
        run: npm run build

      - name: Package Linux (AppImage + deb)
        run: npx electron-builder --linux AppImage deb --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*linux*.AppImage
            dist/*linux*.deb
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync app icons
        run: npm run sync:icons

      - name: Build app bundle
        run: npm run build

      - name: Package macOS dmg
        run: npx electron-builder --mac dmg --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: dist/*mac*.dmg
          if-no-files-found: error

  release:
    # Native Windows installers are not published — Windows users install via WSL (Linux build).
    needs: [build-linux, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "package.json version ($PKG_VERSION) must match tag ($TAG)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build versions manifest
        run: node scripts/build-versions-manifest.mjs "${{ github.repository }}" "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.version }}"

      - name: Extract changelog for this version
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          awk "/^## \[$VERSION\]/, /^## \[/" CHANGELOG.md | sed '$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "GateWizard GUI ${{ steps.meta.outputs.tag }}" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details." >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "**Windows:** no native `.exe` — install the Linux `.deb` or AppImage inside **WSL 2** (Ubuntu 24.04 recommended)." >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md" >> release_notes.md
          cat release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: GateWizard GUI ${{ steps.meta.outputs.version }}
          body_path: release_notes.md
          generate_release_notes: false
          files: |
            dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync manifest to public gatewizard repo
        env:
          UPDATE_MANIFEST_TOKEN: ${{ secrets.UPDATE_MANIFEST_TOKEN }}
        run: |
          if [ -z "$UPDATE_MANIFEST_TOKEN" ]; then
            echo "UPDATE_MANIFEST_TOKEN not set — skip syncing to public gatewizard repo."
            echo "Copy dist/versions.json to gatewizard/releases/gui-versions.json manually, or add the secret."
            exit 0
          fi
          git clone "https://x-access-token:${UPDATE_MANIFEST_TOKEN}@github.com/maurobedoya/gatewizard.git" gatewizard-public
          mkdir -p gatewizard-public/releases
          cp dist/versions.json gatewizard-public/releases/gui-versions.json
          cd gatewizard-public
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/gui-versions.json
          git diff --staged --quiet || git commit -m "chore: update GUI versions manifest for ${{ steps.meta.outputs.tag }}"
          git push origin main
