<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GateWizard</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*"
    />
  </head>

  <body>
    <div id="app"></div>
    <script>
      ;(function () {
        var t = localStorage.getItem('gw_theme')
        if (t !== 'light') document.getElementById('app').classList.add('dark')
      })()
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
