<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    />
    <title>GateWizard</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        user-select: none;
        background: transparent;
        font-family: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      @font-face {
        font-family: 'Roboto';
        font-style: normal;
        font-display: swap;
        font-weight: 400;
        src: url('./fonts/roboto/roboto-latin-ext-400-normal.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0,
          U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Roboto';
        font-style: normal;
        font-display: swap;
        font-weight: 400;
        src: url('./fonts/roboto/roboto-latin-400-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
          U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF,
          U+FFFD;
      }
      @font-face {
        font-family: 'Roboto';
        font-style: normal;
        font-display: swap;
        font-weight: 500;
        src: url('./fonts/roboto/roboto-latin-500-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Roboto';
        font-style: normal;
        font-display: swap;
        font-weight: 700;
        src: url('./fonts/roboto/roboto-latin-700-normal.woff2') format('woff2');
      }

      html.fade-out,
      html.fade-out body {
        opacity: 0;
        transition: opacity 0.35s ease-out;
      }

      .splash {
        position: fixed;
        inset: 0;
        background: transparent;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 0.75rem 0.85rem 0.9rem;
        gap: 0.55rem;
      }

      /* Scaled hex so hex + status + bar fit a square window without clipping. */
      .stage-wrap {
        position: relative;
        flex: 0 0 auto;
        width: 248px;
        height: 286px;
        margin: 0;
      }

      /* Regular pointy-top hexagon (width / height = sqrt(3)/2 ≈ 0.866). */
      .panel {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0c;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      }

      .logo-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        height: 100%;
        padding: 0 1rem;
        box-sizing: border-box;
      }

      .splash-logo {
        display: block;
        width: 76px;
        height: 76px;
        object-fit: contain;
        pointer-events: none;
        flex-shrink: 0;
      }

      .wordmark {
        margin: 0;
        white-space: nowrap;
        font-size: 0.72rem;
        font-weight: 300;
        letter-spacing: 0.06em;
        color: #ececec;
        line-height: 1;
      }

      /* Glowing progress border, drawn on top and NOT clipped, so its halo
         and sparks can bloom slightly outside the hex edge. */
      .hex-border {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      .hex-track {
        fill: none;
        stroke: rgba(255, 255, 255, 0.10);
        stroke-width: 2;
      }
      .hex-progress {
        fill: none;
        stroke: #ffffff;
        stroke-width: 3;
        stroke-linecap: round;
      }

      .status-block {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
        flex: 0 0 auto;
        width: 92%;
        max-width: 320px;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        opacity: 0;
        animation: statusIn 0.5s ease-out 0.25s both;
      }
      .status-meta-row {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.45rem 0.55rem;
        min-height: 1.1em;
      }
      .status-meta {
        margin: 0;
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(229, 229, 229, 0.72);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }
      .status-elapsed {
        margin: 0;
        font-size: 0.65rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
        color: rgba(245, 197, 66, 0.9);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }
      .activity-dots {
        display: none;
        align-items: center;
        gap: 3px;
        height: 8px;
      }
      .status-block.busy .activity-dots {
        display: inline-flex;
      }
      .activity-dots span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #f5c542;
        opacity: 0.3;
        will-change: opacity, transform;
      }
      .status {
        margin: 0;
        width: 100%;
        text-align: center;
        font-size: 0.72rem;
        font-weight: 500;
        line-height: 1.35;
        letter-spacing: 0.02em;
        color: #e5e5e5;
        text-shadow:
          0 1px 2px rgba(0, 0, 0, 0.9),
          0 0 12px rgba(0, 0, 0, 0.75);
        min-height: 1.9em;
        max-height: 2.7em;
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      /* Keep status text readable; activity is shown via dots + bar shimmer instead of fading text. */
      .status-block.manual .status {
        animation: none;
        opacity: 1;
      }
      .progress-track {
        position: relative;
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, #f5c542 0%, #ffe08a 55%, #ffffff 100%);
        box-shadow: 0 0 10px rgba(245, 197, 66, 0.45);
        transition: width 0.35s ease-out;
      }
      /* Sliding highlight so long stagnant steps still look alive. */
      .progress-shimmer {
        display: none;
        position: absolute;
        inset: 0;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.38) 50%,
          transparent 70%
        );
        background-size: 220% 100%;
        animation: progressShimmer 1.6s linear infinite;
        pointer-events: none;
        will-change: background-position;
      }
      .status-block.busy .progress-shimmer {
        display: block;
      }
      @keyframes statusIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes progressShimmer {
        0% { background-position: 120% 0; }
        100% { background-position: -120% 0; }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="stage-wrap">
        <div class="panel">
          <div class="logo-wrap">
            <img
              class="splash-logo"
              src="brand/logos/app-window-dark.png"
              alt=""
            />
            <p class="wordmark">GateWizard</p>
          </div>
        </div>

        <!-- Glowing progress border + spark layer -->
        <svg class="hex-border" id="hexBorder" viewBox="0 0 280 323" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="3" result="b" />
              <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
            <filter id="sparkGlow" x="-200%" y="-200%" width="500%" height="500%">
              <feGaussianBlur stdDeviation="1.4" result="b" />
              <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <path class="hex-track" id="hexTrack"
            d="M140 1 L279 81 L279 242 L140 322 L1 242 L1 81 Z" />
          <path class="hex-progress" id="hexProgress" filter="url(#glow)"
            d="M140 1 L279 81 L279 242 L140 322 L1 242 L1 81 Z" />
          <g id="sparkLayer"></g>
          <g id="headLayer" filter="url(#glow)">
            <circle id="headHalo" r="6" fill="#ffffff" opacity="0" />
            <circle id="headDot" r="2.6" fill="#ffffff" opacity="0" />
          </g>
        </svg>
      </div>

      <div id="statusBlock" class="status-block busy">
        <div class="status-meta-row">
          <p id="statusMeta" class="status-meta">Starting</p>
          <p id="statusElapsed" class="status-elapsed">0:00</p>
          <div class="activity-dots" id="activityDots" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>
        <p id="status" class="status">Preparing…</p>
        <div class="progress-track" aria-hidden="true">
          <div id="progressFill" class="progress-fill"></div>
          <div class="progress-shimmer"></div>
        </div>
      </div>
    </div>

    <script>
      /* ---------- Hex sparkle loop (decorative) + linear bar (real progress) ---------- */
      const SVGNS = 'http://www.w3.org/2000/svg'
      const hexBorder = document.getElementById('hexBorder')
      const progressPath = document.getElementById('hexProgress')
      const sparkLayer = document.getElementById('sparkLayer')
      const headDot = document.getElementById('headDot')
      const headHalo = document.getElementById('headHalo')
      const totalLen = progressPath.getTotalLength()
      progressPath.style.strokeDasharray = totalLen
      progressPath.style.strokeDashoffset = totalLen
      progressPath.style.opacity = '1'

      let curr = 0
      let installBusy = true
      let lastTs = 0
      let sparks = []
      let borderRafId = null

      // Loop: fill → brief hold → fade out (line disappears, no retreat) → reset → repeat.
      let phase = 'fill' // 'fill' | 'hold' | 'fade'
      let phaseStart = 0
      const DEMO_FILL = 5200
      const DEMO_HOLD = 900
      const DEMO_FADE = 650
      const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2)

      function spawnSparks(x, y, n) {
        for (let i = 0; i < n; i++) {
          const ang = Math.random() * Math.PI * 2
          const spd = 0.4 + Math.random() * 1.3
          const c = document.createElementNS(SVGNS, 'circle')
          c.setAttribute('r', (0.6 + Math.random() * 1.1).toFixed(2))
          c.setAttribute('fill', '#ffffff')
          c.setAttribute('filter', 'url(#sparkGlow)')
          sparkLayer.appendChild(c)
          sparks.push({
            el: c, x, y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 0.3,
            life: 1, decay: 0.012 + Math.random() * 0.02,
          })
        }
        if (sparks.length > 120) {
          const extra = sparks.splice(0, sparks.length - 120)
          extra.forEach((s) => s.el.remove())
        }
      }

      function borderFrame(ts) {
        if (!lastTs) lastTs = ts
        const dt = Math.min(50, ts - lastTs)
        lastTs = ts
        if (!phaseStart) phaseStart = ts
        const elapsed = ts - phaseStart
        const prev = curr

        if (phase === 'fill') {
          const p = Math.min(1, elapsed / DEMO_FILL)
          curr = easeInOut(p)
          progressPath.style.opacity = '1'
          if (hexBorder) hexBorder.style.opacity = '1'
          if (p >= 1) {
            curr = 1
            phase = 'hold'
            phaseStart = ts
          }
        } else if (phase === 'hold') {
          curr = 1
          progressPath.style.opacity = '1'
          if (elapsed >= DEMO_HOLD) {
            phase = 'fade'
            phaseStart = ts
          }
        } else {
          // Fade the drawn stroke out while keeping it fully drawn — never shrink backwards.
          curr = 1
          const f = Math.min(1, elapsed / DEMO_FADE)
          progressPath.style.opacity = String(1 - f)
          if (f >= 1) {
            curr = 0
            progressPath.style.strokeDashoffset = totalLen
            progressPath.style.opacity = '0'
            phase = 'fill'
            phaseStart = ts
          }
        }

        const drawn = totalLen * curr
        if (phase !== 'fade' || curr > 0) {
          progressPath.style.strokeDashoffset = totalLen - drawn
        }

        // Leading head + sparks only while filling forward
        if (phase === 'fill' && curr > 0.001 && curr < 0.999) {
          const pt = progressPath.getPointAtLength(drawn)
          headDot.setAttribute('cx', pt.x); headDot.setAttribute('cy', pt.y)
          headHalo.setAttribute('cx', pt.x); headHalo.setAttribute('cy', pt.y)
          headDot.setAttribute('opacity', '1')
          headHalo.setAttribute('opacity', '0.5')
          const speed = curr - prev
          if (speed > 0.0002) spawnSparks(pt.x, pt.y, speed > 0.004 ? 3 : 1)
        } else {
          headDot.setAttribute('opacity', '0')
          headHalo.setAttribute('opacity', '0')
        }

        for (let i = sparks.length - 1; i >= 0; i--) {
          const s = sparks[i]
          s.x += s.vx; s.y += s.vy; s.vy += 0.03; s.life -= s.decay
          if (s.life <= 0) { s.el.remove(); sparks.splice(i, 1); continue }
          s.el.setAttribute('cx', s.x.toFixed(2))
          s.el.setAttribute('cy', s.y.toFixed(2))
          s.el.setAttribute('opacity', s.life.toFixed(3))
        }

        // dt unused for phase timing but keeps frame pacing stable if we extend later
        void dt
        borderRafId = requestAnimationFrame(borderFrame)
      }

      function startSplashAnimation() {
        if (!borderRafId) {
          lastTs = 0
          phase = 'fill'
          phaseStart = 0
          curr = 0
          borderRafId = requestAnimationFrame(borderFrame)
        }
      }

      // Kept for API compatibility — hex is decorative; real progress is the lower bar only.
      window.setSplashProgress = (_p) => {}
      window.stopSplashLoop = () => {}

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startSplashAnimation)
      } else {
        startSplashAnimation()
      }

      const statusBlock = document.getElementById('statusBlock')
      const statusEl = document.getElementById('status')
      const statusMeta = document.getElementById('statusMeta')
      const statusElapsed = document.getElementById('statusElapsed')
      const progressFill = document.getElementById('progressFill')
      const activityDotEls = Array.from(
        document.querySelectorAll('#activityDots span')
      )

      let installStartedAt = null
      let activityPhase = 0

      function formatElapsed(ms) {
        const totalSec = Math.max(0, Math.floor(ms / 1000))
        const h = Math.floor(totalSec / 3600)
        const m = Math.floor((totalSec % 3600) / 60)
        const s = totalSec % 60
        if (h > 0) {
          return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
        }
        return `${m}:${String(s).padStart(2, '0')}`
      }

      function ensureInstallTimer() {
        if (installStartedAt != null) return
        installStartedAt = Date.now()
      }

      function setStatusBusy(busy) {
        installBusy = !!busy
        if (!statusBlock) return
        statusBlock.classList.toggle('busy', installBusy)
      }

      setInterval(() => {
        if (statusElapsed && installStartedAt != null) {
          statusElapsed.textContent = formatElapsed(Date.now() - installStartedAt)
        }
        if (!installBusy || activityDotEls.length === 0) return
        activityPhase = (activityPhase + 1) % activityDotEls.length
        activityDotEls.forEach((el, i) => {
          const on = i === activityPhase
          el.style.opacity = on ? '1' : '0.28'
          el.style.transform = on ? 'scale(1.2)' : 'scale(0.85)'
        })
      }, 320)

      window.setSplashStatus = (text, busy = true) => {
        if (!statusEl) return
        statusEl.textContent = text
        setStatusBusy(busy)
      }

      /**
       * Install progress drives the lower bar + status only (hex keeps looping).
       * @param {{ message: string, percent: number, stepIndex?: number, stepCount?: number, busy?: boolean }} payload
       */
      window.setSplashInstallProgress = (payload) => {
        if (!payload || typeof payload !== 'object') return
        const percent = Math.max(0, Math.min(100, Number(payload.percent) || 0))
        const busy = payload.busy !== false && percent < 100
        const message = typeof payload.message === 'string' ? payload.message : ''
        const stepIndex = Number(payload.stepIndex) || 0
        const stepCount = Number(payload.stepCount) || 0

        ensureInstallTimer()

        if (statusBlock) statusBlock.classList.add('manual')
        if (progressFill) progressFill.style.width = `${percent}%`
        if (statusEl && message) statusEl.textContent = message
        if (statusMeta) {
          const stepLabel =
            stepIndex > 0 && stepCount > 0
              ? `Step ${stepIndex}/${stepCount} · ${percent}%`
              : `${percent}%`
          statusMeta.textContent = stepLabel
        }
        setStatusBusy(busy)
      }
    </script>
  </body>
</html>
