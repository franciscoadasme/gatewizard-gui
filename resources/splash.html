<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:"
    />
    <title>GateWizard</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        user-select: none;
        background: transparent;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }

      html.fade-out,
      html.fade-out body {
        opacity: 0;
        transition: opacity 0.35s ease-out;
      }

      .splash {
        display: flex;
        width: 100%;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        background: transparent;
        clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
        animation: hexIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes hexIn {
        from {
          opacity: 0;
          transform: scale(0.88);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .logo {
        display: block;
        max-width: min(58vw, 160px);
        max-height: min(52vh, 160px);
        object-fit: contain;
        background: transparent;
        animation: logoIn 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
      }

      @keyframes logoIn {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.92);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .status {
        margin: 0;
        font-size: 0.8125rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        color: #e5e5e5;
        text-shadow:
          0 1px 2px rgba(0, 0, 0, 0.9),
          0 0 12px rgba(0, 0, 0, 0.75);
        animation:
          statusIn 0.55s ease-out 0.28s both,
          statusPulse 1.6s ease-in-out 0.9s infinite;
      }

      @keyframes statusPulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes statusIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <img id="logo" class="logo" src="splash.png" alt="GateWizard logo" />
      <p class="status">Loading…</p>
    </div>
    <script>
      const logo = document.getElementById('logo')
      logo.addEventListener('error', () => {
        if (!logo.dataset.fallback) {
          logo.dataset.fallback = '1'
          logo.src = 'icon.png'
        }
      })
    </script>
  </body>
</html>
