<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:"
    />
    <title>GateWizard</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        user-select: none;
        background: transparent;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }

      html.fade-out,
      html.fade-out body {
        opacity: 0;
        transition: opacity 0.35s ease-out;
      }

      .splash {
        position: fixed;
        inset: 0;
        background: transparent;
        overflow: hidden;
      }

      /* Hex stays fixed at the visual centre; status is anchored below it. */
      .stage-wrap {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 280px;
        height: 323px;
      }

      /* Regular pointy-top hexagon (width / height = sqrt(3)/2 ≈ 0.866). */
      .panel {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0c;
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      }

      .logo-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        height: 100%;
        padding: 0 1rem;
        box-sizing: border-box;
      }

      .splash-logo {
        display: block;
        width: 88px;
        height: 88px;
        object-fit: contain;
        pointer-events: none;
        flex-shrink: 0;
      }

      .wordmark {
        margin: 0;
        white-space: nowrap;
        font-size: 0.72rem;
        font-weight: 300;
        letter-spacing: 0.06em;
        color: #ececec;
        line-height: 1;
      }

      /* Glowing progress border, drawn on top and NOT clipped, so its halo
         and sparks can bloom slightly outside the hex edge. */
      .hex-border {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      .hex-track {
        fill: none;
        stroke: rgba(255, 255, 255, 0.10);
        stroke-width: 2;
      }
      .hex-progress {
        fill: none;
        stroke: #ffffff;
        stroke-width: 3;
        stroke-linecap: round;
      }

      .status {
        position: absolute;
        left: 50%;
        top: calc(50% + 161.5px + 0.75rem);
        transform: translateX(-50%);
        width: 88%;
        max-width: 320px;
        margin: 0;
        text-align: center;
        font-size: 0.75rem;
        font-weight: 500;
        line-height: 1.35;
        letter-spacing: 0.02em;
        color: #e5e5e5;
        text-shadow:
          0 1px 2px rgba(0, 0, 0, 0.9),
          0 0 12px rgba(0, 0, 0, 0.75);
        opacity: 0;
        animation: statusIn 0.5s ease-out 0.25s both;
      }
      .status.busy {
        animation:
          statusIn 0.5s ease-out 0.25s both,
          statusPulse 1.6s ease-in-out 1s infinite;
      }
      @keyframes statusIn {
        from { opacity: 0; transform: translateX(-50%) translateY(6px); }
        to { opacity: 1; transform: translateX(-50%) translateY(0); }
      }
      @keyframes statusPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="stage-wrap">
        <div class="panel">
          <div class="logo-wrap">
            <img
              class="splash-logo"
              src="brand/logos/app-window-dark.png"
              alt=""
            />
            <p class="wordmark">GateWizard</p>
          </div>
        </div>

        <!-- Glowing progress border + spark layer -->
        <svg class="hex-border" id="hexBorder" viewBox="0 0 280 323" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="3" result="b" />
              <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
            <filter id="sparkGlow" x="-200%" y="-200%" width="500%" height="500%">
              <feGaussianBlur stdDeviation="1.4" result="b" />
              <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <path class="hex-track" id="hexTrack"
            d="M140 1 L279 81 L279 242 L140 322 L1 242 L1 81 Z" />
          <path class="hex-progress" id="hexProgress" filter="url(#glow)"
            d="M140 1 L279 81 L279 242 L140 322 L1 242 L1 81 Z" />
          <g id="sparkLayer"></g>
          <g id="headLayer" filter="url(#glow)">
            <circle id="headHalo" r="6" fill="#ffffff" opacity="0" />
            <circle id="headDot" r="2.6" fill="#ffffff" opacity="0" />
          </g>
        </svg>
      </div>

      <p id="status" class="status busy">Starting…</p>
    </div>

    <script>
      /* ---------- Glowing progress border ---------- */
      const SVGNS = 'http://www.w3.org/2000/svg'
      const progressPath = document.getElementById('hexProgress')
      const sparkLayer = document.getElementById('sparkLayer')
      const headDot = document.getElementById('headDot')
      const headHalo = document.getElementById('headHalo')
      const totalLen = progressPath.getTotalLength()
      progressPath.style.strokeDasharray = totalLen
      progressPath.style.strokeDashoffset = totalLen

      let curr = 0 // displayed progress 0..1 (soft-interpolated)
      let target = 0 // target progress 0..1
      let manual = false // true once setSplashProgress is called
      let lastTs = 0
      let sparks = []
      let borderRafId = null

      // Demo auto-fill (used only until the app calls setSplashProgress):
      // fill, hold, fade out, repeat — so the effect is visible on loop.
      let demoStart = 0
      const DEMO_FILL = 5200
      const DEMO_HOLD = 1400
      const DEMO_FADE = 700
      const DEMO_CYCLE = DEMO_FILL + DEMO_HOLD + DEMO_FADE
      const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2)

      function spawnSparks(x, y, n) {
        for (let i = 0; i < n; i++) {
          const ang = Math.random() * Math.PI * 2
          const spd = 0.4 + Math.random() * 1.3
          const c = document.createElementNS(SVGNS, 'circle')
          c.setAttribute('r', (0.6 + Math.random() * 1.1).toFixed(2))
          c.setAttribute('fill', '#ffffff')
          c.setAttribute('filter', 'url(#sparkGlow)')
          sparkLayer.appendChild(c)
          sparks.push({
            el: c, x, y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 0.3,
            life: 1, decay: 0.012 + Math.random() * 0.02,
          })
        }
        if (sparks.length > 120) {
          const extra = sparks.splice(0, sparks.length - 120)
          extra.forEach((s) => s.el.remove())
        }
      }

      function borderFrame(ts) {
        if (!lastTs) lastTs = ts
        const dt = Math.min(50, ts - lastTs)
        lastTs = ts

        // Demo target curve (disabled once manual progress is supplied)
        if (!manual) {
          if (!demoStart) demoStart = ts
          const t = (ts - demoStart) % DEMO_CYCLE
          if (t < DEMO_FILL) {
            target = easeInOut(t / DEMO_FILL)
            document.getElementById('hexBorder').style.opacity = '1'
          } else if (t < DEMO_FILL + DEMO_HOLD) {
            target = 1
          } else {
            const f = (t - DEMO_FILL - DEMO_HOLD) / DEMO_FADE
            document.getElementById('hexBorder').style.opacity = (1 - f).toFixed(3)
            if (f >= 0.99) { curr = 0; target = 0 }
          }
        }

        // Soft interpolation toward the target
        const prev = curr
        curr += (target - curr) * Math.min(1, dt * 0.006)
        if (curr < 0) curr = 0
        if (curr > 1) curr = 1

        const drawn = totalLen * curr
        progressPath.style.strokeDashoffset = totalLen - drawn

        // Leading head + sparks (only while actively filling)
        if (curr > 0.001 && curr < 0.999) {
          const pt = progressPath.getPointAtLength(drawn)
          headDot.setAttribute('cx', pt.x); headDot.setAttribute('cy', pt.y)
          headHalo.setAttribute('cx', pt.x); headHalo.setAttribute('cy', pt.y)
          headDot.setAttribute('opacity', '1')
          headHalo.setAttribute('opacity', '0.5')
          const speed = (curr - prev)
          if (speed > 0.0002) spawnSparks(pt.x, pt.y, speed > 0.004 ? 3 : 1)
        } else {
          headDot.setAttribute('opacity', '0')
          headHalo.setAttribute('opacity', '0')
        }

        // Advance + retire sparks
        for (let i = sparks.length - 1; i >= 0; i--) {
          const s = sparks[i]
          s.x += s.vx; s.y += s.vy; s.vy += 0.03; s.life -= s.decay
          if (s.life <= 0) { s.el.remove(); sparks.splice(i, 1); continue }
          s.el.setAttribute('cx', s.x.toFixed(2))
          s.el.setAttribute('cy', s.y.toFixed(2))
          s.el.setAttribute('opacity', s.life.toFixed(3))
        }

        borderRafId = requestAnimationFrame(borderFrame)
      }

      function startSplashAnimation() {
        if (!borderRafId) {
          lastTs = 0
          demoStart = 0
          borderRafId = requestAnimationFrame(borderFrame)
        }
      }

      // Drive the border from real load progress (0..1). Soft-interpolated.
      window.setSplashProgress = (p) => {
        manual = true
        document.getElementById('hexBorder').style.opacity = '1'
        target = Math.max(0, Math.min(1, p))
      }

      // Fill the border to 100% when the app is ready.
      window.stopSplashLoop = () => {
        window.setSplashProgress(1)
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startSplashAnimation)
      } else {
        startSplashAnimation()
      }

      window.setSplashStatus = (text, busy = true) => {
        const el = document.getElementById('status')
        if (!el) return
        el.textContent = text
        el.classList.toggle('busy', busy)
      }
    </script>
  </body>
</html>
