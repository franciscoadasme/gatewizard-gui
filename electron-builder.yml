appId: com.gatewizard.gui
productName: GateWizard GUI
copyright: Copyright © GateWizard
icon: build/icon.png
afterPack: scripts/after-pack.cjs
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!svelte.config.mjs'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
extraResources:
  - from: backend
    to: backend
win:
  executableName: gatewizard-gui-win
  icon: build/icon.ico
  signAndEditExecutable: false
nsis:
  artifactName: ${name}-${version}-win-${arch}-setup.${ext}
  shortcutName: GateWizard GUI (Windows)
  uninstallDisplayName: GateWizard GUI (Windows)
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  createDesktopShortcut: always
mac:
  executableName: gatewizard-gui-mac
  identity: '-'
  gatekeeperAssess: false
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  executableName: gatewizard-gui-linux
  # Match Electron app_id (from package.json desktopName) so GNOME/Wayland
  # can link the running window to the launcher icon (avoids generic gear).
  syncDesktopName: true
  icon: build/icons
  maintainer: gatewizard
  category: Science
  desktop:
    entry:
      Name: GateWizard GUI (Linux)
deb:
  packageName: gatewizard-gui-linux
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  # Replaces electron-builder defaults. Include those plus ALSA (Electron always
  # links libasound.so.2). t64 names first for Ubuntu 24.04+ / 26.04.
  depends:
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64 | libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1
    - libdrm2
appImage:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
