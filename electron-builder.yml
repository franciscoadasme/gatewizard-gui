appId: com.gatewizard.gui
productName: GateWizard GUI
copyright: Copyright © GateWizard
icon: build/icon.png
afterPack: scripts/after-pack-win-icon.cjs
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!svelte.config.mjs'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
extraResources:
  - from: backend
    to: backend
win:
  executableName: gatewizard-gui-win
  icon: build/icon.ico
  signAndEditExecutable: false
nsis:
  artifactName: ${name}-${version}-win-${arch}-setup.${ext}
  shortcutName: GateWizard GUI (Windows)
  uninstallDisplayName: GateWizard GUI (Windows)
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  createDesktopShortcut: always
mac:
  executableName: gatewizard-gui-mac
  identity: '-'
  gatekeeperAssess: false
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  executableName: gatewizard-gui-linux
  icon: build/icons
  maintainer: gatewizard
  category: Science
  desktop:
    entry:
      Name: GateWizard GUI (Linux)
      StartupWMClass: gatewizard-gui-linux
deb:
  packageName: gatewizard-gui-linux
  artifactName: ${name}-${version}-linux-${arch}.${ext}
appImage:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
